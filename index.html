<div class="flex min-h-screen flex-col lg:pl-64">

      </div>

      <div class="relative ml-auto">

    if (!ui.draftKeywords.length) { toast('Agregue al menos una palabra clave para poder evaluar hojas de vida.', 'warn'); $('#kw-input').focus(); return; }
    if (dayNum(d.deadline) < dayNum(d.openDate)) { toast('La fecha límite no puede ser anterior a la apertura.', 'warn'); return; }
    var old = vacById(f.dataset.id), data = { title: d.title, type: d.type, area: d.area || 'Sin área', slots: Math.max(1, Math.round(Number(d.slots)) || 1), description: d.description, keywords: ui.draftKeywords.slice(), openDate: d.openDate, deadline: d.deadline, startDate: d.startDate, recruiter: d.recruiter, status: d.status };
    if (old) Object.assign(old, data); else { data.id = uid('v'); data.filledBase = 0; state.vacancies.unshift(data); }
    save(); closeModal(); ui.vacSearch = ''; ui.vacStatus = ''; ui.vacType = ''; ui.view = 'vacantes'; render(); toast(old ? 'Vacante actualizada.' : 'Vacante creada: ' + d.title + ' (' + plural(data.slots, 'cupo', 'cupos') + ').', 'ok');
  } else if (f.id === 'form-cand') {
    state.candidates.push({ id: uid('c'), name: d.name, email: d.email, phone: d.phone, source: d.source, notes: d.notes, vacancyId: d.vacancyId, stage: 0, stageSince: t, match: null, createdAt: t, outcome: null, consent: true, history: [{ stage: 0, date: t, note: 'Postulación registrada manualmente' }], notesLog: [], hiring: null });
    save(); closeModal(); ui.pipeVac = ui.pipeVac ? d.vacancyId : ''; ui.view = 'pipeline'; render(); toast(d.name + ' quedó en Postulación.', 'ok');
  } else if (f.id === 'form-cand-edit') {
    c = candById(f.dataset.id); if (!c) return;
    Object.assign(c, { name: d.name, email: d.email, phone: d.phone, source: d.source, notes: d.notes, vacancyId: d.vacancyId }); save(); render(); openCandidate(c.id); toast('Datos guardados.', 'ok');
  } else if (f.id === 'form-contact') {
    c = candById(f.dataset.id); if (!c || !c.hiring) return;
    c.hiring.contacts.push({ date: t, note: d.note + (d.startDate ? ' · Ingreso reprogramado para el ' + fmtDate(d.startDate) : '') });
    if (d.startDate) c.hiring.startDate = d.startDate;
    save(); closeModal(); render(); toast('Contacto registrado' + (d.startDate ? ' e ingreso reprogramado' : '') + '.', 'ok');
  } else if (f.id === 'form-emp') {
    if (dayNum(d.hireDate) > dayNum(t)) { toast('La fecha de ingreso no puede ser futura.', 'warn'); return; }
    state.employees.push(newEmp(d.name, d.role, d.area, d.type, d.shift, d.hireDate)); save(); closeModal(); ui.view = 'rotacion'; render(); toast(d.name + ' se agregó a la plantilla.', 'ok');
  } else if (f.id === 'form-import') {
    var ok = 0, bad = 0;
    String(d.rows || '').split(/\r?\n/).forEach(function (line, i) {
      if (!line.trim()) return;
      var cells = (line.indexOf('\t') >= 0 ? line.split('\t') : (line.indexOf(';') >= 0 ? line.split(';') : line.split(','))).map(function (x) { return x.trim(); });
      if (i === 0 && /nombre/i.test(cells[0])) return;
      var date = parseDate(cells[5]);
      if (!cells[0] || !date || dayNum(date) > dayNum(t)) { bad++; return; }
      var sh = SHIFTS.find(function (x) { return normalize(x) === normalize(cells[4]); });
      state.employees.push(newEmp(cells[0].slice(0, 90), (cells[1] || 'Sin cargo').slice(0, 70), (cells[2] || 'Sin área').slice(0, 40), /adm|estrat/i.test(cells[3] || '') ? TYPES[1] : TYPES[0], sh || 'Por asignar', date)); ok++;
    });
    if (!ok) { toast('No se importó ninguna fila. Revise el orden de las columnas y el formato de la fecha de ingreso.', 'warn'); return; }
    save(); closeModal(); ui.view = 'rotacion'; render(); toast(plural(ok, 'colaborador importado', 'colaboradores importados') + (bad ? ' · ' + plural(bad, 'fila omitida', 'filas omitidas') + ' por nombre o fecha inválidos' : '') + '.', bad ? 'warn' : 'ok');
  } else if (f.id === 'form-exit') {
    var emp = empById(d.empId); if (!emp) return;
    if (dayNum(d.exitDate) < dayNum(emp.hireDate)) { toast('La fecha de salida no puede ser anterior al ingreso (' + fmtDate(emp.hireDate) + ').', 'warn'); return; }
    if (dayNum(d.exitDate) > dayNum(t)) { toast('La fecha de salida no puede ser futura.', 'warn'); return; }
    Object.assign(emp, { status: 'Retirado', exitDate: d.exitDate, exitType: d.exitType, exitReason: d.exitReason, exitNotes: d.exitNotes });
    save(); closeModal(); ui.cop = freshCop(); ui.view = 'rotacion'; render();
    toast(emp.name + ' quedó como Retirado' + (tenure(emp) < 90 ? ' (rotación temprana: ' + tenure(emp) + ' días)' : '') + '. Tasas y gráficos recalculados.', 'ok');
  } else if (f.id === 'form-ev-register') {
    var ev = ui.ev, r = ev.result; v = vacById(ev.vacId); if (!r || !v) return;
    var nc = { id: uid('c'), name: d.name, email: d.email, phone: d.phone, source: d.source, vacancyId: v.id, stage: 1, stageSince: t, match: r.score, createdAt: t, outcome: null, consent: true, hiring: null,
      notes: r.diag.title + ' (' + r.score + '%). Coincidencias: ' + (r.found.map(function (x) { return x.keyword; }).join(', ') || 'ninguna') + '. Brechas: ' + (r.missing.map(function (x) { return x.keyword; }).join(', ') || 'ninguna') + '.' + (r.years.best ? ' Experiencia detectada: ' + plural(r.years.best, 'año', 'años') + '.' : ''),
      history: [{ stage: 0, date: t, note: 'Registrado desde el Evaluador IA' + (ev.fileName ? ' · ' + ev.fileName : '') }, { stage: 1, date: t, note: 'Enviado a Preselección con match de ' + r.score + '%' }], notesLog: [] };
    state.candidates.push(nc); save(); ui.ev = freshEv(); ui.ev.vacId = v.id; ui.pipeVac = v.id; ui.filters = { overdue: false, high: false, unscored: false }; go('pipeline');
    toast(nc.name + ' quedó en Preselección con ' + r.score + '% de match.', 'ok');
  }
});

function g0() { var g = $('#gate'); if (g) g.dataset.sig = ''; render(); }
function addKeywords(raw) {
  raw.split(',').map(function (s) { return s.trim(); }).filter(Boolean).forEach(function (k) { if (ui.draftKeywords.length < 25 && !ui.draftKeywords.some(function (x) { return normalize(x) === normalize(k); })) ui.draftKeywords.push(k.slice(0, 50)); });
  refreshKeywords();
}
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { if (modalOpen()) closeModal(); else if (ui.notifOpen) { ui.notifOpen = false; renderChrome(); icons(); } $('#search-results').hidden = true; }
  if (e.target.id === 'kw-input') {
    if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); addKeywords(e.target.value); e.target.value = ''; }
    else if (e.key === 'Backspace' && !e.target.value && ui.draftKeywords.length) { ui.draftKeywords.pop(); refreshKeywords(); }
  }
});
document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.id === 'vac-search') { ui.vacSearch = t.value; $('#vac-grid').innerHTML = vacancyCards(); icons(); }
  else if (t.id === 'ev-text') ui.ev.text = t.value;
  else if (t.id === 'global-search') renderSearch(t.value);
  else if (t.id === 'cop-target') { ui.cop.target = t.value; $('#cop-impact').innerHTML = impactHtml(retentionDiagnosis()); }
});
document.addEventListener('change', function (e) {
  var t = e.target, c;
  if (t.id === 'vac-status') { ui.vacStatus = t.value; $('#vac-grid').innerHTML = vacancyCards(); icons(); }
  else if (t.id === 'vac-type') { ui.vacType = t.value; $('#vac-grid').innerHTML = vacancyCards(); icons(); }
  else if (t.id === 'pipe-vac') { ui.pipeVac = t.value; render(); }
  else if (t.id === 'dir-status' || t.id === 'dir-area') { if (t.id === 'dir-status') ui.dirStatus = t.value; else ui.dirArea = t.value; $('#dir-body').innerHTML = directoryRows(); icons(); }
  else if (t.id === 'cop-focus') ui.cop.focus = t.value;
  else if (t.id === 'cop-budget') ui.cop.budget = Number(t.value);
  else if (t.id === 'ev-vac') { ui.ev.vacId = t.value; ui.ev.result = null; if (ui.ev.status === 'done') ui.ev.status = 'idle'; var ta = $('#ev-text'); if (ta) ui.ev.text = ta.value; render(); }
  else if (t.id === 'ev-file') handleFile(t.files[0]);
  else if (t.id === 'backup-file' && t.files[0]) {
    var fr = new FileReader();
    fr.onload = function () {
      var obj = null; try { obj = JSON.parse(String(fr.result || '')); } catch (err) { obj = null; }
      var data = obj && obj.state ? obj.state : obj;
      if (!validState(data)) { toast('El archivo no es un respaldo válido de TalentOS HR.', 'warn'); return; }
      pendingBackup = data; closeSidebar();
      confirmModal('Restaurar respaldo', 'Se reemplazarán todos los datos actuales por los del respaldo: ' + data.vacancies.length + ' vacantes, ' + data.candidates.length + ' candidatos y ' + data.employees.length + ' colaboradores.', 'Restaurar', 'backup-yes');
    };
    fr.readAsText(t.files[0], 'UTF-8'); t.value = '';
  }
  else if (t.id === 'cand-outcome') { c = candById(t.dataset.id); if (c) { c.outcome = t.value; c.history[c.history.length - 1].note = 'Cierre: ' + t.value; save(); render(); openCandidate(c.id); } }
  else if (t.dataset && t.dataset.start) { c = candById(t.dataset.start); if (c && c.hiring && t.value) { c.hiring.startDate = t.value; save(); render(); toast('Fecha de ingreso actualizada.', 'ok'); } }
});
$('#global-search').addEventListener('focus', function (e) { if (e.target.value.trim()) renderSearch(e.target.value); });
function renderSearch(q) {
  var box = $('#search-results'), n = normalize(q).trim();
  if (!n) { box.hidden = true; return; }
  var cs = state.candidates.filter(function (c) { return normalize(c.name + ' ' + c.email + ' ' + c.phone).indexOf(n) >= 0; }).slice(0, 5);
  var vs = state.vacancies.filter(function (v) { return normalize(v.title + ' ' + v.recruiter + ' ' + v.area + ' ' + v.keywords.join(' ')).indexOf(n) >= 0; }).slice(0, 4);
  var es = state.employees.filter(function (x) { return normalize(x.name + ' ' + x.role + ' ' + x.area).indexOf(n) >= 0; }).slice(0, 4);
  var head = function (t) { return '<p class="px-3 pb-1 pt-2 text-[11px] font-semibold uppercase tracking-wide text-slate-400">' + t + '</p>'; }, html = '';
  if (cs.length) html += head('Candidatos') + cs.map(function (c) { var v = vacById(c.vacancyId); return '<button data-action="open-cand" data-id="' + c.id + '" class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-left hover:bg-slate-50">' + avatar(c.name, 'h-8 w-8 text-[11px]') + '<span class="min-w-0 flex-1"><span class="block truncate text-sm font-medium text-slate-800">' + esc(c.name) + '</span><span class="block truncate text-xs text-slate-500">' + esc(STAGES[c.stage]) + (v ? ' · ' + esc(v.title) : '') + '</span></span>' + matchBadge(c.match) + '</button>'; }).join('');
  if (vs.length) html += head('Vacantes') + vs.map(function (v) { return '<button data-action="go-pipeline" data-id="' + v.id + '" class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-left hover:bg-slate-50"><span class="flex h-8 w-8 flex-none items-center justify-center rounded-lg bg-indigo-50 text-indigo-600">' + ic('briefcase', 'h-4 w-4') + '</span><span class="min-w-0 flex-1"><span class="block truncate text-sm font-medium text-slate-800">' + esc(v.title) + '</span><span class="block truncate text-xs text-slate-500">' + esc(v.area) + ' · ' + esc(v.status) + '</span></span></button>'; }).join('');
  if (es.length) html += head('Colaboradores') + es.map(function (x) { return '<button data-action="nav" data-view="rotacion" class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-left hover:bg-slate-50">' + avatar(x.name, 'h-8 w-8 text-[11px]') + '<span class="min-w-0 flex-1"><span class="block truncate text-sm font-medium text-slate-800">' + esc(x.name) + '</span><span class="block truncate text-xs text-slate-500">' + esc(x.role) + ' · ' + esc(x.status) + '</span></span></button>'; }).join('');
  box.innerHTML = html || '<p class="px-3 py-4 text-center text-sm text-slate-500">Sin resultados para "' + esc(q) + '".</p>';
  box.hidden = false; icons();
}

/* Arrastrar y soltar (HTML5) */
var dragId = null;
document.addEventListener('dragstart', function (e) { var card = e.target.closest && e.target.closest('.kcard'); if (!card) return; dragId = card.dataset.id; card.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId); });
document.addEventListener('dragend', function () { dragId = null; document.querySelectorAll('.dragging, .drag-over, .is-over').forEach(function (el) { el.classList.remove('dragging', 'drag-over', 'is-over'); }); });
document.addEventListener('dragover', function (e) {
  var col = e.target.closest && e.target.closest('.kcol'), dz = e.target.closest && e.target.closest('#dropzone');
  if (col && dragId) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; document.querySelectorAll('.kcol.drag-over').forEach(function (el) { if (el !== col) el.classList.remove('drag-over'); }); col.classList.add('drag-over'); }
  else if (dz) { e.preventDefault(); dz.classList.add('is-over'); }
});
document.addEventListener('dragleave', function (e) { var dz = e.target.closest && e.target.closest('#dropzone'); if (dz && !dz.contains(e.relatedTarget)) dz.classList.remove('is-over'); });
document.addEventListener('drop', function (e) {
  var col = e.target.closest && e.target.closest('.kcol'), dz = e.target.closest && e.target.closest('#dropzone');
  if (col && dragId) { e.preventDefault(); var id = dragId; dragId = null; moveCandidate(id, Number(col.dataset.stage)); render(); }
  else if (dz) { e.preventDefault(); dz.classList.remove('is-over'); if (e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); }
});

boot();
})();
</script>
